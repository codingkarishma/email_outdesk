[project]
name = "email-drafting-agent"
version = "0.2.0"
description = "LangChain + Groq agent that drafts personalized B2B cold outreach emails, with a CLI and a web UI"
readme = "README.md"
authors = [
    { name = "Karishma santani", email = "karishmasantani13@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.2.2",
    "pydantic>=2.6",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
email-drafting-agent = "email_drafting_agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["email_drafting_agent*"]

[tool.setuptools.package-data]
email_drafting_agent = ["static/*"]
